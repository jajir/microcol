<text x="24" y="32" font-size="23">Deset podob jednotek / porovnání v malém měřítku</text>
<text x="24" y="58" font-size="14">Každý malý výřez má prostor 45 × 45 px. Zvětšení vpravo 2×. Návrhy, nikoli snímky běžící hry.</text>
