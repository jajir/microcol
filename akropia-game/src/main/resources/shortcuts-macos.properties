# Akropia default keyboard shortcuts for macOS.
# Edit this file to change the packaged defaults; no Java change is needed.
# Every action key must be present. Each action has one binding; an empty
# value leaves the action unbound. A binding is modifiers and one key joined
# by '+', for example Ctrl+Shift+O. Modifiers: Ctrl, Alt, Shift, Meta (the
# Command key on macOS). Key names follow JavaFX KeyCode names, for example
# Space, Enter, Tab, F5, Up. Bindings match only with exactly the written
# modifiers. Actions active at the same time must not share a binding.
# Inventory and decisions: docs/keyboard-shortcuts.md

# Every window and screen
global.developerMode=F3

# Main window screens with Load, Save, Settings or Quit (not the map editor)
session.load=Meta+O
session.save=Meta+S
session.settings=Meta+Comma
session.quit=Meta+Shift+Q

# Main menu
menu.continue=C
menu.secretOption=S
menu.freeGame=N
menu.campaign=P
menu.hallOfFame=H

# Main map
map.quickSave=F5
map.quickLoad=F9
map.endTurn=Meta+Enter
map.mainMenu=Meta+Shift+M
map.restartMission=Meta+Shift+T
map.declareIndependence=Meta+Shift+I
map.retire=Meta+Shift+R
map.nextUnit=Tab
map.skipUnit=Space
map.move=M
map.confirmMove=Enter
map.goTo=G
map.goToTile=Shift+G
map.buildColony=B
map.plow=P
map.clearForest=F
map.buildRoad=Shift+R
map.fortify=Shift+F
map.sentry=Shift+S
map.disband=Shift+D
map.jettison=Shift+J
map.tradeRoutes=Shift+T
map.newTradeRoute=Shift+N
map.center=C
map.colonies=I
map.europe=E
map.congress=K
map.nativeSettlements=N
map.statistics=R
map.turnReport=T
map.goals=O
map.help=H
map.scrollUp=W
map.scrollLeft=A
map.scrollDown=S
map.scrollRight=D

# Europe port screen
europe.recruit=R
europe.buyUnit=B
