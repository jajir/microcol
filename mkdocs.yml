site_name: MicroCol
site_description: Project documentation for the MicroCol colonization game.
site_url: https://jajir.github.io/microcol/docs/
repo_url: https://github.com/jajir/microcol
edit_uri: blob/develop/docs/
docs_dir: docs
site_dir: target/docs-site/docs
use_directory_urls: false

theme:
  name: readthedocs

extra_css:
  - stylesheets/extra.css

plugins:
  - search

hooks:
  - scripts/docs/hooks.py

extra:
  source_revision: !ENV [DOCS_REVISION, develop]

validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
