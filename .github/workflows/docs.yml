name: Publish documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Build and publish development game]
    types: [requested, completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# Check main and its pull requests; do not interrupt an active deployment.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Check completion callbacks without external services
        run: python -m unittest discover -s scripts/codex -p 'test_*.py'
      - name: Check local worker launcher without inference
        run: python -m unittest discover -s scripts/local-worker -p 'test_*.py'
      - name: Check documentation links and catalogue consistency
        run: python -m unittest discover -s scripts/docs -p 'test_*.py'
      - name: Check regression selection and report generation
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Prepare the latest main test report and badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/regression.py publish --revision "$(git rev-parse HEAD)"
          cat target/test-status/report.md >> docs/test-results.md
      - name: Build documentation and validate links
        env:
          DOCS_REVISION: ${{ github.sha }}
        run: python -m mkdocs build --strict
      - name: Include generated test badges in the same Pages deployment
        run: cp target/test-status/test-results-*.svg target/docs-site/
      # MkDocs builds docs/ directly at the Pages root; microcol-site is excluded.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
