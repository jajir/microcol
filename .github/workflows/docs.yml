name: Publish documentation

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Publish the newest develop state; never interrupt an active deployment.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Check repository link conversion
        run: python -m unittest discover -s scripts/docs -p 'test_*.py'
      - name: Build documentation and validate links
        env:
          DOCS_REVISION: ${{ github.sha }}
        run: python -m mkdocs build --strict
      # MkDocs builds docs/ directly at the Pages root; microcol-site is excluded.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
