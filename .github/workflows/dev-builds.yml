name: Build and publish development game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      game_required: ${{ steps.filter.outputs.game_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test change classification
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Classify the complete change set
        id: filter
        run: python3 scripts/ci/game_changes.py

  functional:
    needs: changes
    if: needs.changes.outputs.game_required == 'true'
    name: Functional player scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run game tests and all functional player scenarios in Docker
        run: |
          bash scripts/ui-tests/test-runner.sh
          docker compose -f compose.ui-tests.yml run --build --rm ui-tests
      - name: Keep functional test evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-functional
          path: |
            target/docker-ui/
            target/docker-ui-runner-checks/
          if-no-files-found: warn
          retention-days: 14

  checks:
    needs: changes
    if: needs.changes.outputs.game_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install build-tool test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq unzip
      - name: Package launchers and test the updater and publication contract
        # The launcher dependency creates both archives before the Java tests run.
        run: mvn -B -ntp -pl microcol-build-tests -am clean verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-launchers
          path: microcol-launcher/target/dev-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Keep launcher and publication test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-build-tools
          path: |
            microcol-build-tests/target/surefire-reports/
            microcol-build-tests/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

  native:
    needs: changes
    if: needs.changes.outputs.game_required == 'true'
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            module: microcol-dist-macos
            verification: verify-macos
            architecture: aarch64
          - platform: macos-x86_64
            runner: macos-15-intel
            module: microcol-dist-macos
            verification: verify-macos
            architecture: x64
          - platform: linux-x86_64
            runner: ubuntu-24.04
            module: microcol-dist-linux
            verification: verify-linux
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.architecture }}
          cache: maven
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev libgtk-3-0 libasound2t64 xvfb xauth x11-utils jq unzip
      - name: Build and verify native distributions through Maven
        # Profile dependencies put native packaging before its Failsafe tests.
        # TestFX player scenarios run in the separate required functional job.
        env:
          PLATFORM: ${{ matrix.platform }}
          VERIFICATION_PROFILE: ${{ matrix.verification }}
        run: |
          maven_command=(mvn -B -ntp -pl microcol-build-tests -am -P"$VERIFICATION_PROFILE" clean verify
            -Dmicrocol.platform="$PLATFORM" -Dmicrocol.build.id="dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}")
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a --server-args='-screen 0 1280x1024x24' "${maven_command[@]}"
          else
            "${maven_command[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-${{ matrix.platform }}
          path: ${{ matrix.module }}/target/dev-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Keep actual test evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.platform }}
          path: |
            microcol-game/target/surefire-reports/
            microcol-build-tests/target/surefire-reports/
            microcol-build-tests/target/failsafe-reports/
            microcol-build-tests/target/native-smoke/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.game_required == 'true'
    needs: [changes, checks, native, functional]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    # Never interrupt an upload; the publisher also rejects an older promotion.
    concurrency:
      group: microcol-dev-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dev-*
          path: target/dev-assets
          merge-multiple: true
      - name: Publish complete release, then update the development channel
        env:
          GH_TOKEN: ${{ github.token }}
        # Maven supplies packages and SHA-256 sidecars; only this job writes releases.
        run: bash scripts/distribution/publish.sh target/dev-assets "dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}" "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
