name: Java dependency compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        java: ['11', '17']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Inspect resolved Guava dependencies
        run: mvn -B -ntp -pl microcol-game -am dependency:tree -Dverbose "-Dincludes=com.google.guava:*,com.google.inject:*"
      - name: Compile, test and package the game
        run: mvn -B -ntp -pl microcol-game -am clean verify
      - name: Keep game test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-tests-${{ matrix.os }}-java-${{ matrix.java }}
          path: microcol-game/target/surefire-reports/
          if-no-files-found: warn
